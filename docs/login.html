<!DOCTYPE html><html lang="fa" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ورود مدیر | Kian Music</title><style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050509;
    color:#fff;
    overflow:hidden;
}

/* =========================
   NEON BACKGROUND
========================= */

body::before{
    content:"";
    position:fixed;
    width:600px;
    height:600px;
    background:#7c3aed;
    filter:blur(200px);
    opacity:.20;
    top:-250px;
    right:-180px;
    z-index:-2;
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    width:550px;
    height:550px;
    background:#00e5ff;
    filter:blur(210px);
    opacity:.10;
    bottom:-250px;
    left:-180px;
    z-index:-2;
    pointer-events:none;
}

/* =========================
   LOGIN CARD
========================= */

.login-card{
    width:calc(100% - 40px);
    max-width:430px;
    padding:35px 30px;
    border-radius:27px;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.075),
        rgba(255,255,255,.018)
    );

    border:1px solid rgba(180,124,255,.20);

    box-shadow:
    0 30px 90px rgba(0,0,0,.55),
    0 0 55px rgba(124,58,237,.12);

    backdrop-filter:blur(20px);
}

/* =========================
   ADMIN ICON
========================= */

.admin-icon{
    width:72px;
    height:72px;
    margin:0 auto 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:31px;

    border-radius:22px;

    background:
    linear-gradient(
        135deg,
        rgba(124,58,237,.25),
        rgba(0,229,255,.08)
    );

    border:1px solid rgba(180,124,255,.28);

    box-shadow:
    0 0 35px rgba(124,58,237,.20);
}

/* =========================
   LOGO
========================= */

.logo{
    text-align:center;
    font-size:29px;
    font-weight:900;

    background:
    linear-gradient(
        90deg,
        #fff,
        #b47cff,
        #00e5ff
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    text-align:center;
    font-size:11px;
    color:#777;
    margin-top:8px;
    margin-bottom:30px;
}

/* =========================
   LABEL
========================= */

label{
    display:block;
    font-size:11px;
    color:#aaa;
    margin-bottom:8px;
}

/* =========================
   INPUT
========================= */

.input{
    width:100%;
    height:51px;

    padding:0 15px;
    margin-bottom:18px;

    border-radius:13px;

    outline:none;

    border:1px solid rgba(255,255,255,.10);

    background:rgba(255,255,255,.045);

    color:#fff;

    font-size:12px;

    transition:.25s;
}

.input:focus{
    border-color:#7c3aed;

    box-shadow:
    0 0 0 4px rgba(124,58,237,.08);
}

.input::placeholder{
    color:#555;
}

/* =========================
   PASSWORD
========================= */

.password-box{
    position:relative;
    width:100%;
}

.password-box .input{
    padding-left:52px;
}

/* =========================
   EYE
========================= */

.eye-button{
    position:absolute;

    left:8px;
    top:0;

    width:43px;
    height:51px;

    border:0;

    background:transparent;

    color:#777;

    font-size:18px;

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:10px;

    transition:.25s;
}

.eye-button:hover{
    color:#fff;
    background:rgba(124,58,237,.12);
}

/* =========================
   LOGIN BUTTON
========================= */

.login-button{
    width:100%;
    height:54px;

    border:0;
    border-radius:14px;

    color:#fff;

    font-size:13px;
    font-weight:bold;

    cursor:pointer;

    background:
    linear-gradient(
        135deg,
        #7c3aed,
        #2563eb,
        #0891b2
    );

    box-shadow:
    0 12px 35px rgba(124,58,237,.28);

    transition:.3s;
}

.login-button:hover{
    transform:translateY(-3px);
    filter:brightness(1.12);

    box-shadow:
    0 15px 45px rgba(124,58,237,.40);
}

.login-button:active{
    transform:scale(.98);
}

/* =========================
   ERROR
========================= */

.error{
    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:11px;

    background:rgba(255,70,100,.07);

    border:1px solid rgba(255,70,100,.18);

    color:#ff9baa;

    font-size:10px;

    text-align:center;
}

/* =========================
   NEON BACK TO SITE
========================= */

.back{
    width:100%;
    height:48px;

    margin-top:18px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    text-decoration:none;

    color:#aaa;

    font-size:11px;
    font-weight:bold;

    border-radius:13px;

    background:
    linear-gradient(
        135deg,
        rgba(124,58,237,.10),
        rgba(0,229,255,.045)
    );

    border:1px solid rgba(180,124,255,.18);

    box-shadow:
    0 0 18px rgba(124,58,237,.06),
    inset 0 0 18px rgba(124,58,237,.025);

    backdrop-filter:blur(12px);

    transition:.3s;
}

.back:hover{
    color:#fff;

    transform:translateY(-2px);

    border-color:rgba(180,124,255,.48);

    background:
    linear-gradient(
        135deg,
        rgba(124,58,237,.22),
        rgba(0,229,255,.08)
    );

    box-shadow:
    0 0 28px rgba(124,58,237,.18),
    0 0 12px rgba(0,229,255,.08);
}

.back:active{
    transform:scale(.98);
}

/* =========================
   MOBILE
========================= */

@media(max-width:450px){

    .login-card{
        padding:30px 20px;
    }

    .logo{
        font-size:25px;
    }

}

</style></head><body><div class="login-card"><div class="admin-icon">
    🔐
</div>


<div class="logo">
    Kian Music
</div>


<div class="subtitle">
    ورود به پنل مدیریت
</div>


<form id="loginForm">


    <label>
        نام کاربری
    </label>


    <input
        class="input"
        id="username"
        type="text"
        placeholder="نام کاربری مدیر"
        autocomplete="username"
        required
    >


    <label>
        رمز عبور
    </label>


    <div class="password-box">

        <input
            class="input"
            id="password"
            type="password"
            placeholder="رمز عبور"
            autocomplete="current-password"
            required
        >


        <button
            type="button"
            class="eye-button"
            id="togglePassword"
            aria-label="نمایش رمز"
        >
            👁️
        </button>

    </div>


    <button
        class="login-button"
        type="submit"
    >
        🔐 ورود به پنل
    </button>


</form>


<div
    class="error"
    id="error"
>
    نام کاربری یا رمز عبور اشتباه است.
</div>


<!-- دکمه جدید -->

<a
    href="./index.html"
    class="back"
>    
     بازگشت به سایت
</a>

</div><script>

/* =========================
   اطلاعات ورود
========================= */

const USERNAME = "admin";
const PASSWORD = "admin";


/* =========================
   چشم رمز عبور
========================= */

const passwordInput =
document.getElementById("password");

const togglePassword =
document.getElementById("togglePassword");


togglePassword.addEventListener(
    "click",
    function(){

        if(passwordInput.type === "password"){

            passwordInput.type = "text";

            togglePassword.textContent = "🙈";

        }else{

            passwordInput.type = "password";

            togglePassword.textContent = "👁️";

        }

    }
);


/* =========================
   ورود مدیر
========================= */

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const username =
        document
        .getElementById("username")
        .value
        .trim();


        const password =
        document
        .getElementById("password")
        .value;


        if(
            username === USERNAME &&
            password === PASSWORD
        ){

            sessionStorage.setItem(
                "kian_admin_login",
                "true"
            );


            window.location.replace(
                "./admin.html"
            );


        }else{

            document
            .getElementById("error")
            .style.display = "block";

        }

    }
);

</script></body></html>

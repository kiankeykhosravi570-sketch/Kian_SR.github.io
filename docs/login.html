<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ورود مدیر | Kian Music</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;

background:#050509;

color:#fff;

overflow:hidden;
}


/* =========================
   NEON BACKGROUND
========================= */

body::before{
content:"";

position:fixed;

width:550px;
height:550px;

background:#7c3aed;

filter:blur(190px);

opacity:.20;

top:-230px;
right:-170px;

z-index:-2;
}

body::after{
content:"";

position:fixed;

width:500px;
height:500px;

background:#00e5ff;

filter:blur(190px);

opacity:.10;

bottom:-230px;
left:-170px;

z-index:-2;
}


/* =========================
   LOGIN CARD
========================= */

.login-card{

width:calc(100% - 40px);

max-width:430px;

padding:35px 30px;

border-radius:27px;

background:
linear-gradient(
145deg,
rgba(255,255,255,.075),
rgba(255,255,255,.018)
);

border:1px solid rgba(180,124,255,.18);

box-shadow:

0 30px 90px rgba(0,0,0,.55),

0 0 55px rgba(124,58,237,.10);

backdrop-filter:blur(20px);

position:relative;

overflow:hidden;
}

.login-card::before{

content:"";

position:absolute;

width:200px;
height:200px;

background:#7c3aed;

filter:blur(100px);

opacity:.12;

top:-100px;
right:-90px;

pointer-events:none;
}

.login-card::after{

content:"";

position:absolute;

width:180px;
height:180px;

background:#00e5ff;

filter:blur(100px);

opacity:.07;

bottom:-100px;
left:-80px;

pointer-events:none;
}


/* =========================
   LOGO
========================= */

.logo{

text-align:center;

font-size:28px;

font-weight:900;

margin-bottom:8px;

background:
linear-gradient(
90deg,
#fff,
#b47cff,
#00e5ff
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;
}

.subtitle{

text-align:center;

font-size:11px;

color:#777;

margin-bottom:30px;
}


/* =========================
   ICON
========================= */

.admin-icon{

width:70px;
height:70px;

margin:0 auto 20px;

display:flex;

align-items:center;
justify-content:center;

font-size:30px;

border-radius:22px;

background:
linear-gradient(
135deg,
rgba(124,58,237,.22),
rgba(0,229,255,.07)
);

border:1px solid rgba(180,124,255,.25);

box-shadow:
0 0 35px rgba(124,58,237,.18);
}


/* =========================
   LABEL
========================= */

label{

display:block;

font-size:11px;

color:#aaa;

margin-bottom:8px;
}


/* =========================
   INPUT
========================= */

.input{

width:100%;

height:50px;

padding:0 15px;

margin-bottom:18px;

border-radius:13px;

outline:none;

border:1px solid rgba(255,255,255,.10);

background:
rgba(255,255,255,.045);

color:#fff;

font-size:12px;

transition:.25s;
}

.input:focus{

border-color:#7c3aed;

box-shadow:
0 0 0 4px rgba(124,58,237,.08);
}

.input::placeholder{

color:#555;
}


/* =========================
   LOGIN BUTTON
========================= */

.login-button{

width:100%;

height:53px;

border:0;

border-radius:14px;

color:#fff;

font-size:13px;

font-weight:bold;

cursor:pointer;

background:
linear-gradient(
135deg,
#7c3aed,
#2563eb,
#0891b2
);

box-shadow:
0 12px 35px rgba(124,58,237,.28);

transition:.3s;
}

.login-button:hover{

transform:translateY(-3px);

filter:brightness(1.12);

box-shadow:
0 16px 45px rgba(124,58,237,.38);
}

.login-button:active{

transform:scale(.98);
}


/* =========================
   ERROR
========================= */

.error{

display:none;

margin-top:15px;

padding:12px;

border-radius:11px;

background:
rgba(255,70,100,.07);

border:1px solid rgba(255,70,100,.18);

color:#ff9baa;

font-size:10px;

text-align:center;
}


/* =========================
   BACK
========================= */

.back{

display:block;

text-align:center;

margin-top:22px;

color:#666;

font-size:10px;

text-decoration:none;

transition:.2s;
}

.back:hover{

color:#fff;
}


/* =========================
   MOBILE
========================= */

@media(max-width:450px){

.login-card{

padding:30px 20px;
}

.logo{

font-size:25px;
}

}

</style>

</head>


<body>


<div class="login-card">


<div class="admin-icon">
🔐
</div>


<div class="logo">
Kian Music
</div>


<div class="subtitle">
ورود به پنل مدیریت
</div>



<form id="loginForm">


<label>
نام کاربری
</label>

<input

class="input"

id="username"

type="text"

placeholder="نام کاربری مدیر"

autocomplete="username"

required>



<label>
رمز عبور
</label>

<input

class="input"

id="password"

type="password"

placeholder="رمز عبور"

autocomplete="current-password"

required>



<button
class="login-button"
type="submit">

🔐 ورود به پنل

</button>


</form>



<div
class="error"
id="error">

نام کاربری یا رمز عبور صحیح نیست.

</div>



<a
href="index.html"
class="back">

← بازگشت به سایت

</a>


</div>



<script>

/*
   DEMO LOGIN

   توجه:
   این سیستم فقط برای تست ظاهری است
   و امنیت واقعی ندارد.
*/


const USERNAME = "admin";

const PASSWORD = "admin";


document
.getElementById("loginForm")
.addEventListener(
"submit",
function(event){

event.preventDefault();


const username =
document
.getElementById("username")
.value
.trim();


const password =
document
.getElementById("password")
.value;


if(
username === USERNAME &&
password === PASSWORD
){

sessionStorage.setItem(
"kian_admin_login",
"true"
);


window.location.href =
"admin.html";


}else{

document
.getElementById("error")
.style
.display="block";

}

});

</script>


</body>

  </html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ارسال آهنگ | Kian Music</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#080808;
color:white;
}

header{
background:#101010;
border-bottom:1px solid #222;
padding:20px;
}

.header{
max-width:900px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:23px;
font-weight:bold;
}

.logo span{
color:#777;
}

.back{
color:#aaa;
text-decoration:none;
font-size:13px;
}

.container{
max-width:700px;
margin:50px auto;
padding:0 20px;
}

.title{
text-align:center;
margin-bottom:35px;
}

.title h1{
font-size:30px;
margin-bottom:12px;
}

.title p{
color:#888;
line-height:2;
}

.form-box{
background:#121212;
border:1px solid #222;
border-radius:18px;
padding:25px;
}

label{
display:block;
margin-bottom:8px;
font-size:14px;
color:#ccc;
}

input,
textarea,
select{
width:100%;
background:#181818;
border:1px solid #292929;
border-radius:10px;
padding:14px;
color:white;
outline:none;
margin-bottom:20px;
font-size:14px;
}

textarea{
height:120px;
resize:vertical;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:white;
color:black;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.85;
}

.success{
display:none;
margin-top:20px;
padding:15px;
background:#181818;
border:1px solid #333;
border-radius:10px;
text-align:center;
line-height:2;
}

footer{
text-align:center;
margin-top:60px;
padding:30px;
border-top:1px solid #222;
color:#666;
font-size:12px;
}

</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
Kian <span>Music</span>
</div>

<a class="back" href="index.html">
← بازگشت به سایت
</a>

</div>

</header>


<div class="container">

<div class="title">

<h1>📤 ارسال آهنگ</h1>

<p>
اطلاعات آهنگ خود را وارد کنید.
</p>

</div>


<div class="form-box">

<form
action="https://docs.google.com/forms/d/e/1FAIpQLScCytFMryyL4_j3SirtQ9Y4SHpqhEWy0tNrK2MqW5lTC7G2Vw/formResponse"
method="POST"
target="hidden_iframe"
onsubmit="submitted=true;">

<label>
نام خواننده
</label>

<input
type="text"
name="entry.755885147"
placeholder="نام خواننده"
required>


<label>
نوع درخواست
</label>

<select
name="entry.730839540"
required>

<option value="">
انتخاب کنید
</option>

<option value="انتشار آهنگ">
انتشار آهنگ
</option>

<option value="تبلیغ آهنگ">
تبلیغ آهنگ
</option>

<option value="درخواست همکاری">
درخواست همکاری
</option>

</select>


<label>
نام آهنگ
</label>

<input
type="text"
name="entry.1447632670"
placeholder="نام آهنگ"
required>


<label>
راه ارتباطی
</label>

<input
type="text"
name="entry.436797421"
placeholder="شماره تماس یا آیدی شبکه اجتماعی"
required>


<label>
توضیحات
</label>

<textarea
name="entry.1121425605"
placeholder="توضیحات مربوط به آهنگ...">
</textarea>


<button type="submit">
📤 ارسال درخواست
</button>

</form>


<iframe
name="hidden_iframe"
id="hidden_iframe"
style="display:none;">
</iframe>


<div
class="success"
id="success">

✅ درخواست شما با موفقیت ارسال شد.

</div>

</div>

</div>


<footer>

© 2026 Kian Music

</footer>


<script>

let submitted = false;

document
.getElementById("hidden_iframe")
.onload = function(){

if(submitted){

document
.getElementById("success")
.style.display = "block";

document
.querySelector("form")
.reset();

}

};

</script>

</body>
</html>

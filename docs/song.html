<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>آهنگ | Kian Music</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:#07070b;
color:white;
min-height:100vh;
overflow-x:hidden;
}


/* BACKGROUND */

body::before{
content:"";
position:fixed;
width:450px;
height:450px;
background:#7c3aed;
filter:blur(180px);
opacity:.14;
top:-180px;
right:-150px;
z-index:-1;
}

body::after{
content:"";
position:fixed;
width:400px;
height:400px;
background:#00e5ff;
filter:blur(180px);
opacity:.08;
bottom:-180px;
left:-150px;
z-index:-1;
}


/* HEADER */

header{
position:sticky;
top:0;
z-index:100;

background:rgba(8,8,12,.78);
backdrop-filter:blur(18px);

border-bottom:1px solid rgba(255,255,255,.08);

padding:16px 20px;
}

.header{
max-width:1050px;
margin:auto;

display:flex;
align-items:center;
justify-content:space-between;

gap:15px;
}

.logo{
font-size:23px;
font-weight:900;

background:linear-gradient(
90deg,
#fff,
#b47cff,
#00e5ff
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.back{
color:#ccc;
text-decoration:none;

font-size:12px;

padding:10px 14px;

border-radius:11px;

border:1px solid rgba(255,255,255,.12);

background:rgba(255,255,255,.045);

transition:.25s;
}

.back:hover{
background:rgba(124,58,237,.18);

border-color:rgba(180,124,255,.5);

transform:translateY(-2px);
}


/* CONTAINER */

.container{
max-width:850px;
margin:60px auto;

padding:0 20px;
}


/* SONG CARD */

.song-card{

background:
linear-gradient(
145deg,
rgba(255,255,255,.07),
rgba(255,255,255,.02)
);

border:1px solid rgba(255,255,255,.09);

border-radius:25px;

padding:30px;

box-shadow:
0 25px 70px rgba(0,0,0,.35);
}


/* COVER */

.cover-wrapper{
text-align:center;
margin-bottom:25px;
}

.cover{

width:260px;
height:260px;

max-width:100%;

object-fit:cover;

border-radius:25px;

border:1px solid rgba(255,255,255,.12);

box-shadow:
0 20px 60px rgba(0,0,0,.5);
}


/* SONG INFO */

.info{
text-align:center;
}

.info h1{
font-size:30px;
margin-bottom:10px;
}

.artist{
color:#aaa;
font-size:14px;
}

.tag{

display:inline-block;

margin-top:15px;

padding:6px 10px;

font-size:10px;

border-radius:8px;

color:#c9a8ff;

background:rgba(124,58,237,.12);

border:1px solid rgba(124,58,237,.25);
}


/* PLAYER */

.player{
margin-top:30px;
}

audio{
width:100%;
height:45px;
}


/* BUTTONS */

.buttons{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

margin-top:20px;
}

.btn{

display:flex;

align-items:center;

justify-content:center;

padding:14px;

border-radius:12px;

text-decoration:none;

font-size:13px;

font-weight:bold;

transition:.25s;
}

.download{

background:
linear-gradient(
135deg,
#7c3aed,
#2563eb
);

color:white;

box-shadow:
0 10px 30px rgba(124,58,237,.2);
}

.share{

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.1);

color:#ddd;
}

.btn:hover{

transform:translateY(-3px);

filter:brightness(1.12);
}


/* DESCRIPTION */

.description{

margin-top:30px;

padding-top:25px;

border-top:1px solid rgba(255,255,255,.08);
}

.description h2{

font-size:17px;

margin-bottom:12px;
}

.description p{

color:#888;

font-size:13px;

line-height:2.2;
}


/* FOOTER */

footer{

margin-top:70px;

padding:35px 20px;

border-top:1px solid rgba(255,255,255,.07);

text-align:center;

color:#555;

font-size:11px;
}


/* MOBILE */

@media(max-width:600px){

.container{
margin-top:35px;
}

.song-card{
padding:20px;
}

.cover{
width:210px;
height:210px;
}

.info h1{
font-size:24px;
}

.buttons{
grid-template-columns:1fr;
}

}

</style>

</head>


<body>


<header>

<div class="header">

<div class="logo">
Kian Music
</div>

<a
class="back"
href="index.html">

← بازگشت

</a>

</div>

</header>



<main class="container">


<div class="song-card">


<div class="cover-wrapper">

<img

class="cover"

src="https://placehold.co/600x600"

alt="کاور آهنگ"

>

</div>



<div class="info">

<h1>
آهنگ من
</h1>

<div class="artist">
🎤 Kian
</div>

<span class="tag">
Kian Music
</span>

</div>



<div class="player">

<audio
controls
preload="metadata">

<source

src="../song1.mp3"

type="audio/mpeg"

>

مرورگر شما از پخش صوت پشتیبانی نمی‌کند.

</audio>

</div>



<div class="buttons">


<a

class="btn download"

href="../song1.mp3"

download>

⬇️ دانلود آهنگ

</a>


<a

class="btn share"

href="#"

onclick="shareSong(); return false;">

🔗 اشتراک‌گذاری

</a>


</div>



<div class="description">

<h2>
درباره آهنگ
</h2>

<p>

این صفحه اختصاصی آهنگ در Kian Music است.
اینجا می‌توانید آهنگ را آنلاین گوش کنید،
دانلود کنید و لینک آن را با دوستان خود به اشتراک بگذارید.

</p>

</div>


</div>

</main>



<footer>

Kian Music

<br><br>

© 2026 تمام حقوق محفوظ است.

</footer>



<script>

function shareSong(){

if(navigator.share){

navigator.share({

title:"آهنگ من | Kian Music",

text:"گوش دادن به آهنگ من در Kian Music",

url:window.location.href

});

}else{

navigator.clipboard.writeText(
window.location.href
);

alert(
"لینک آهنگ کپی شد ✅"
);

}

}

</script>


</body>

  </html>

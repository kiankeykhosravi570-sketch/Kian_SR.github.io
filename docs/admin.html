و قبل از "</script>" این JavaScript رو اضافه کن:

function addAdmin(){

const input =
document.getElementById("newAdmin");

const username =
input.value.trim();

if(!username){

alert("نام کاربری را وارد کنید.");

return;

}

const list =
document.getElementById("adminList");

const item =
document.createElement("div");

item.className =
"admin-user";

item.innerHTML = `

<div>

<strong>👤 ${username}</strong>

<span>مدیر سایت</span>

</div>

<button
onclick="removeAdmin(this)"
style="
border:0;
padding:7px 10px;
border-radius:8px;
background:rgba(255,70,90,.08);
color:#ff9baa;
cursor:pointer;
font-size:9px;
">

🗑️ حذف

</button>

`;

list.appendChild(item);

input.value = "";

}


function removeAdmin(button){

if(
confirm("این مدیر حذف شود؟")
){

button
.parentElement
.remove();

}

}

با این کار داخل پنل یک بخش 👑 مدیریت مدیران داری که می‌تونی نام کاربری وارد کنی و به لیست اضافه یا از لیست حذف کنی.

اما فعلاً واقعی نیست و با رفرش صفحه پاک می‌شود. برای واقعی شدنش باید مرحله بعد یک سیستم ذخیره‌سازی و احراز هویت امن اضافه کنیم.

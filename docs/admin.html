<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل مدیریت | Kian Music</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#050509;
color:#fff;
min-height:100vh;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
width:650px;
height:650px;
background:#7c3aed;
filter:blur(210px);
opacity:.16;
top:-300px;
right:-220px;
z-index:-2;
pointer-events:none;
}

body::after{
content:"";
position:fixed;
width:600px;
height:600px;
background:#00e5ff;
filter:blur(220px);
opacity:.09;
bottom:-300px;
left:-220px;
z-index:-2;
pointer-events:none;
}

/* HEADER */

header{
position:sticky;
top:0;
z-index:100;
padding:15px 20px;
background:rgba(5,5,9,.78);
backdrop-filter:blur(22px);
border-bottom:1px solid rgba(255,255,255,.08);
}

.header{
max-width:1200px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.logo{
font-size:24px;
font-weight:900;
background:
linear-gradient(
90deg,
#fff,
#b47cff,
#00e5ff
);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.header-buttons{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.header-button{
text-decoration:none;
color:#ccc;
font-size:10px;
padding:10px 14px;
border-radius:11px;
background:rgba(255,255,255,.045);
border:1px solid rgba(255,255,255,.11);
transition:.25s;
}

.header-button:hover{
color:#fff;
background:rgba(124,58,237,.20);
border-color:rgba(180,124,255,.40);
}

/* MAIN */

.container{
max-width:1200px;
margin:45px auto;
padding:0 20px;
}

.title{
margin-bottom:28px;
}

.title h1{
font-size:32px;
margin-bottom:9px;
background:
linear-gradient(
90deg,
#fff,
#b47cff,
#00e5ff
);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.title p{
font-size:11px;
color:#777;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px;
margin-bottom:22px;
}

.stat{
padding:21px;
border-radius:19px;
background:
linear-gradient(
145deg,
rgba(255,255,255,.065),
rgba(255,255,255,.018)
);
border:1px solid rgba(255,255,255,.08);
transition:.25s;
}

.stat:hover{
transform:translateY(-4px);
border-color:rgba(180,124,255,.35);
}

.stat-icon{
font-size:23px;
margin-bottom:12px;
}

.stat-number{
font-size:26px;
font-weight:900;
margin-bottom:5px;
}

.stat-label{
font-size:10px;
color:#777;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:1.35fr 1fr;
gap:18px;
}

/* CARD */

.card{
padding:23px;
border-radius:20px;
background:
linear-gradient(
145deg,
rgba(255,255,255,.065),
rgba(255,255,255,.018)
);
border:1px solid rgba(255,255,255,.08);
box-shadow:
0 15px 50px rgba(0,0,0,.25);
margin-bottom:18px;
}

.card h2{
font-size:16px;
margin-bottom:18px;
}

/* ACTIONS */

.actions{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:11px;
}

.action{
display:flex;
align-items:center;
gap:12px;
padding:15px;
border-radius:14px;
text-decoration:none;
color:#ddd;
background:
rgba(255,255,255,.035);
border:1px solid rgba(255,255,255,.08);
transition:.25s;
}

.action:hover{
color:#fff;
transform:translateY(-3px);
background:
linear-gradient(
135deg,
rgba(124,58,237,.25),
rgba(0,229,255,.06)
);
border-color:rgba(180,124,255,.4);
}

.action-icon{
font-size:22px;
}

.action strong{
display:block;
font-size:11px;
margin-bottom:4px;
}

.action span{
font-size:9px;
color:#666;
}

/* VISITOR */

.visitor-select{
width:100%;
height:50px;
padding:0 15px;
border-radius:13px;
border:1px solid rgba(180,124,255,.20);
background:#111018;
color:#fff;
font-size:11px;
outline:none;
cursor:pointer;
}

.visitor-select option{
background:#111018;
color:#fff;
}

.visitor-result{
margin-top:15px;
padding:20px;
border-radius:16px;
background:
linear-gradient(
135deg,
rgba(124,58,237,.12),
rgba(0,229,255,.04)
);
border:1px solid rgba(180,124,255,.15);
text-align:center;
}

.visitor-number{
font-size:32px;
font-weight:900;
margin-bottom:6px;
background:
linear-gradient(
90deg,
#fff,
#b47cff,
#00e5ff
);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.visitor-label{
font-size:10px;
color:#777;
}

/* ADMIN MANAGEMENT */

.admin-manager{
display:flex;
gap:9px;
margin-bottom:18px;
}

.admin-input{
flex:1;
height:46px;
padding:0 13px;
border-radius:11px;
outline:none;
border:1px solid rgba(255,255,255,.10);
background:rgba(255,255,255,.04);
color:#fff;
font-size:11px;
}

.admin-input:focus{
border-color:#7c3aed;
box-shadow:
0 0 20px rgba(124,58,237,.12);
}

padding:

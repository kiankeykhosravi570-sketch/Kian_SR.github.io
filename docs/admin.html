<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل مدیریت | Kian Music</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:#050509;
    color:#fff;
}

header{
    width:100%;
    min-height:75px;
    background:#0b0b10;
    border-bottom:1px solid #22222b;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 5%;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#fff;
}

.logo span{
    color:#888;
    font-size:14px;
}

.header-left{
    display:flex;
    gap:10px;
    align-items:center;
}

.header-btn{
    border:1px solid #292933;
    background:#111118;
    color:#fff;
    text-decoration:none;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    font-size:13px;
    transition:.2s;
}

.header-btn:hover{
    background:#1b1b25;
    border-color:#44444f;
}

.container{
    width:90%;
    max-width:1200px;
    margin:30px auto;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:#0b0b10;
    border:1px solid #22222b;
    border-radius:15px;
    padding:20px;
    text-align:center;
}

.stat-icon{
    font-size:28px;
    margin-bottom:10px;
}

.stat-number{
    font-size:27px;
    font-weight:bold;
}

.stat-title{
    margin-top:7px;
    color:#999;
    font-size:13px;
}

.card{
    background:#0b0b10;
    border:1px solid #22222b;
    border-radius:15px;
    padding:22px;
    margin-bottom:20px;
}

.card-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
}

.card-title h2{
    font-size:18px;
}

.card-title span{
    color:#777;
    font-size:12px;
}

.actions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.action{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px;
    background:#111118;
    border:1px solid #24242e;
    border-radius:12px;
    color:#fff;
    text-decoration:none;
    transition:.2s;
}

.action:hover{
    background:#171720;
    border-color:#3b3b47;
    transform:translateY(-2px);
}

.action-icon{
    width:45px;
    height:45px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#191921;
    border-radius:11px;
    font-size:22px;
}

.action strong{
    display:block;
    font-size:14px;
    margin-bottom:5px;
}

.action span{
    display:block;
    color:#888;
    font-size:11px;
}

.section-control-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.section-control-header strong{
    font-size:15px;
}

.section-control-header span{
    color:#777;
    font-size:11px;
}

.site-sections{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.site-section{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    background:#111118;
    border:1px solid #24242e;
    border-radius:13px;
    padding:15px;
}

.section-info{
    display:flex;
    align-items:center;
    gap:13px;
}

.section-icon{
    width:45px;
    height:45px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:11px;
    background:#191921;
    font-size:21px;
}

.section-name{
    font-size:14px;
    font-weight:bold;
}

.section-description{
    margin-top:5px;
    color:#777;
    font-size:11px;
}

.section-status{
    display:inline-block;
    margin-top:7px;
    padding:4px 8px;
    border-radius:6px;
    font-size:10px;
}

.section-status.on{
    background:#12351f;
    color:#61d88b;
}

.section-status.off{
    background:#351719;
    color:#ff7378;
}

.section-toggle{
    width:52px;
    height:28px;
    border:0;
    border-radius:30px;
    background:#33333d;
    position:relative;
    cursor:pointer;
    flex-shrink:0;
    transition:.25s;
}

.section-toggle::after{
    content:"";
    width:22px;
    height:22px;
    background:#fff;
    border-radius:50%;
    position:absolute;
    top:3px;
    right:3px;
    transition:.25s;
}

.section-toggle.active{
    background:#27b95f;
}

.section-toggle.active::after{
    right:27px;
}

.control-info{
    margin-top:15px;
    padding:13px;
    background:#101016;
    border:1px solid #20202a;
    border-radius:10px;
    color:#85858e;
    font-size:11px;
    line-height:2;
}

/* =========================
   CONFIRM MODAL
========================= */

.confirm-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;
    padding:20px;
}

.confirm-overlay.show{
    display:flex;
}

.confirm-box{
    width:100%;
    max-width:400px;
    background:#0d0d13;
    border:1px solid #2a2a35;
    border-radius:18px;
    padding:25px;
    text-align:center;
    box-shadow:0 20px 70px rgba(0,0,0,.6);
    animation:confirmShow .2s ease;
}

@keyframes confirmShow{
    from{
        opacity:0;
        transform:scale(.94);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.confirm-icon{
    width:60px;
    height:60px;
    margin:0 auto 15px;
    border-radius:50%;
    background:#191921;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
}

.confirm-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.confirm-text{
    color:#999;
    font-size:13px;
    line-height:1.9;
    margin-bottom:22px;
}

.confirm-actions{
    display:flex;
    gap:10px;
}

.confirm-btn{
    flex:1;
    border:0;
    border-radius:10px;
    padding:12px;
    cursor:pointer;
    font-family:inherit;
    font-size:13px;
    transition:.2s;
}

.confirm-yes{
    background:#27b95f;
    color:#fff;
}

.confirm-yes:hover{
    background:#20a653;
}

.confirm-no{
    background:#24242d;
    color:#fff;
}

.confirm-no:hover{
    background:#30303a;
}

.visitor-select

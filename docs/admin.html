<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل مدیریت | Kian Music</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050509;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    width:420px;
    height:420px;
    background:#7c3aed;
    filter:blur(150px);
    opacity:.12;
    top:-180px;
    right:-120px;
    pointer-events:none;
    z-index:-1;
}

body::after{
    content:"";
    position:fixed;
    width:380px;
    height:380px;
    background:#00e5ff;
    filter:blur(160px);
    opacity:.07;
    bottom:-180px;
    left:-120px;
    pointer-events:none;
    z-index:-1;
}


/* =========================
   HEADER
========================= */

header{
    height:65px;
    position:sticky;
    top:0;
    z-index:100;

    padding:0 28px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:rgba(5,5,9,.78);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(255,255,255,.07);
}

.logo{
    font-size:15px;
    font-weight:900;
}

.logo span{
    color:#8b5cf6;
}

.header-left{
    display:flex;
    align-items:center;
    gap:9px;
}

.header-btn{
    color:#aaa;
    text-decoration:none;

    padding:9px 13px;

    border-radius:9px;

    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.07);

    font-size:9px;

    cursor:pointer;
    transition:.2s;
}

.header-btn:hover{
    color:#fff;
    border-color:#7c3aed;
}


/* =========================
   CONTAINER
========================= */

.container{
    width:min(1250px,94%);
    margin:28px auto 50px;
}


/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:18px;
}

.stat{
    padding:18px;

    border-radius:16px;

    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.07);

    backdrop-filter:blur(15px);

    transition:.25s;
}

.stat:hover{
    transform:translateY(-3px);
    border-color:rgba(124,58,237,.35);
}

.stat-icon{
    font-size:20px;
    margin-bottom:12px;
}

.stat-number{
    font-size:21px;
    font-weight:900;
}

.stat-title{
    margin-top:5px;
    color:#777;
    font-size:9px;
}


/* =========================
   DASHBOARD
========================= */

.dashboard-grid{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:15px;
}

.column{
    display:flex;
    flex-direction:column;
    gap:15px;
}


/* =========================
   CARD
========================= */

.card{
    padding:20px;

    border-radius:17px;

    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.07);

    backdrop-filter:blur(15px);
}

.card-title{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:17px;
}

.card-title h2{
    font-size:12px;
}

.card-title span{
    color:#666;
    font-size:9px;
}


/* =========================
   ACTIONS
========================= */

.actions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.action{
    display:flex;
    align-items:center;
    gap:11px;

    padding:13px;

    border-radius:12px;

    color:#fff;
    text-decoration:none;

    background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.06);

    transition:.2s;

    cursor:pointer;
}

.action:hover{
    background:rgba(124,58,237,.09);
    border-color:rgba(124,58,237,.35);
    transform:translateY(-2px);
}

.action-icon{
    width:36px;
    height:36px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:rgba(124,58,237,.1);

    font-size:17px;
}

.action strong{
    display:block;
    font-size:10px;
    margin-bottom:4px;
}

.action span{
    display:block;
    color:#666;
    font-size:8px;
}


/* =========================
   SECTION CONTROL
========================= */

.section-control{
    margin-top:17px;
    padding-top:17px;

    border-top:1px solid rgba(255,255,255,.06);
}

.section-control-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:12px;
}

.section-control-header strong{
    font-size:10px;
}

.section-control-header span{
    color:#666;
    font-size:8px;
}

.site-sections{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.site-section{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:12px

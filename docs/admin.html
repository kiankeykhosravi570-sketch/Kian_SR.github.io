<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل مدیریت | Kian Music</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050509;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}


/* =====================================================
   NEON BACKGROUND
===================================================== */

body::before{
    content:"";
    position:fixed;
    width:650px;
    height:650px;
    background:#7c3aed;
    filter:blur(210px);
    opacity:.16;
    top:-280px;
    right:-200px;
    z-index:-2;
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    width:600px;
    height:600px;
    background:#00e5ff;
    filter:blur(220px);
    opacity:.09;
    bottom:-300px;
    left:-200px;
    z-index:-2;
    pointer-events:none;
}


/* =====================================================
   TOP HEADER
===================================================== */

.admin-header{
    position:sticky;
    top:0;
    z-index:9999;

    width:100%;

    padding:16px 25px;

    background:rgba(5,5,9,.84);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    border-bottom:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 10px 40px rgba(0,0,0,.38);
}

.header-inner{
    max-width:1200px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;
}

.logo{
    font-size:24px;
    font-weight:900;

    background:
    linear-gradient(
        90deg,
        #fff,
        #b47cff,
        #00e5ff
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    filter:
        drop-shadow(0 0 12px rgba(124,58,237,.20));
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.admin-status{
    padding:9px 13px;

    border-radius:12px;

    font-size:10px;
    color:#aaa;

    background:
        rgba(255,255,255,.045);

    border:1px solid
        rgba(180,124,255,.15);
}

.logout-btn{
    border:none;
    cursor:pointer;

    padding:9px 14px;

    border-radius:12px;

    color:#fff;

    font-size:10px;
    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            rgba(124,58,237,.28),
            rgba(0,229,255,.08)
        );

    border:1px solid
        rgba(180,124,255,.25);

    transition:.3s;
}

.logout-btn:hover{
    transform:translateY(-2px);

    border-color:
        rgba(0,229,255,.55);

    box-shadow:
        0 0 25px
        rgba(124,58,237,.18);
}


/* =====================================================
   MAIN
===================================================== */

.container{
    max-width:1200px;
    margin:0 auto;

    padding:45px 20px 70px;
}


/* =====================================================
   PAGE TITLE
===================================================== */

.page-title{
    text-align:center;
    margin-bottom:40px;
}

.page-title .badge{

    display:inline-flex;

    align-items:center;
    gap:8px;

    padding:8px 15px;

    border-radius:50px;

    font-size:10px;

    color:#aaa;

    background:
        rgba(255,255,255,.045);

    border:1px solid
        rgba(180,124,255,.16);

    box-shadow:
        0 0 25px
        rgba(124,58,237,.08);

    margin-bottom:18px;
}

.page-title h1{

    font-size:38px;
    font-weight:900;

    background:
        linear-gradient(
            90deg,
            #fff,
            #b47cff,
            #00e5ff
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    margin-bottom:10px;
}

.page-title p{
    color:#666;
    font-size:11px;
    line-height:2;
}


/* =====================================================
   DASHBOARD GRID
===================================================== */

.dashboard-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:15px;

    margin-bottom:35px;
}


/* =====================================================
   STAT CARD
===================================================== */

.stat-card{

    position:relative;

    padding:22px;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.018)
        );

    border:1px solid
        rgba(180,124,255,.14);

    box-shadow:
        0 20px 55px
        rgba(0,0,0,.28);

    overflow:hidden;

    transition:.3s;
}

.stat-card::before{

    content:"";

    position:absolute;

    width:150px;
    height:150px;

    background:#7c3aed;

    filter:blur(80px);

    opacity:.09;

    top:-80px;
    right:-70px;
}

.stat-card:hover{

    transform:translateY(-5px);

    border-color:
        rgba(180,124,255,.35);

    box-shadow:
        0 20px 55px rgba(0,0,0,.35),
        0 0 30px rgba(124,58,237,.08);
}

.stat-icon{

    width:45px;
    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:14px;

    font-size:20px;

    background:
        linear-gradient(
            135deg,
            rgba(124,58,237,.20),
            rgba(0,229,255,.07)
        );

    border:1px solid
        rgba(180,124,255,.20);

    margin-bottom:15px;
}

.stat-card h3{

    font-size:10px;
    color:#777;

    margin-bottom:8px;
}

.stat-number{

    font-size:25px;
    font-weight:900;

    background:
        linear-gradient(
            90deg,
            #fff,
            #b47cff
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}


/* =====================================================
   SECTION
===================================================== */

.section{
    margin-bottom:30px;
}

.section-title{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:15px;
}

.section-title h2{

    font-size:17px;
    font-weight:900;
}

.section-title span{

    color:#666;
    font-size:9px;
}


/* =====================================================
   GLASS CARD
===================================================== */

.card{

    position:relative;

    padding:23px;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.018)
        );

    border:1px solid
        rgba(180,124,255,.14);

    box-shadow:
        0 20px 65px
        rgba(0,0,0,.32);

    overflow:hidden;
}

.card::before{

    content:"";

    position:absolute;

    width:240px;
    height:240px;

    background:#7c3aed;

    filter:blur(110px);

    opacity:.07;

    top:-140px;
    right:-120px;

    pointer-events:none;
}


/* =====================================================
   QUICK ACTIONS
===================================================== */

.actions-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:12px;
}

.action-btn{

    position:relative;

    display:flex;

    align-items:center;

    gap:12px;

    padding:16px;

    border-radius:16px;

    text-decoration:none;

    color:#ccc;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.015)
        );

    border:1px solid
        rgba(255,255,255,.07);

    transition:.3s;

    overflow:hidden;
}

.action-btn:hover{

    color:#fff;

    transform:translateY(-4px);

    border-color:
        rgba(180,124,255,.38);

    background:
        linear-gradient(
            145deg,
            rgba(124,58,237,.18),
            rgba(0,229,255,.05)
        );

    box-shadow:
        0 0 25px
        rgba(124,58,237,.10);
}

.action-icon{

    width:42px;
    height:42px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    font-size:18px;

    background:
        linear-gradient(
            135deg,
            rgba(124,58,237,.20),
            rgba(0,229,255,.06)
        );

    border:1px solid
        rgba(180,124,255,.18);
}

.action-text strong{

    display:block;

    font-size:11px;

    margin-bottom:5px;
}

.action-text span{

    display:block;

    color:#666;

    font-size:9px;
}


/* =====================================================
   SITE SECTIONS
===================================================== */

.section-controls{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;
}

.control-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:16px;

    border-radius:15px;

    background:
        rgba(255,255,255,.035);

    border:1px solid
        rgba(255,255,255,.06);

    transition:.3s;
}

.control-row:hover{

    border-color:
        rgba(180,124,255,.25);
}

.control-info{

    display:flex;
    align-items:center;
    gap:10px;
}

.control-icon{

    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:11px;

    background:
        rgba(124,58,237,.12);

    border:1px solid
        rgba(180,124,255,.15);
}

.control-info strong{

    display:block;
    font-size:11px;
}

.control-info span{

    display:block;

    margin-top:4px;

    color:#666;
    font-size:8px;
}


/* =====================================================
   SWITCH
===================================================== */

.switch{

    position:relative;

    width:48px;
    height:25px;

    flex-shrink:0;
}

.switch input{
    display:none;
}

.slider{

    position:absolute;

    inset:0;

    cursor:pointer;

    border-radius:30px;

    background:#181820;

    border:1px solid
        rgba(255,255,255,.10);

    transition:.3s;
}

.slider::before{

    content:"";

    position:absolute;

    width:17px;
    height:17px;

    left:3px;
    top:3px;

    border-radius:50%;

    background:#666;

    transition:.3s;
}

.switch input:checked + .slider{

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #2563eb
        );

    box-shadow:
        0 0 18px
        rgba(124,58,237,.35);
}

.switch input:checked + .slider::before{

    transform:translateX(23px);

    background:#fff;
}


/* =====================================================
   FORM
===================================================== */

.form-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:15px;
}

.form-group{
    margin-bottom:0;
}

.form-group.full{
    grid-column:1 / -1;
}

.form-group label{

    display:block;

    color:#999;

    font-size:10px;

    margin-bottom:8px;
}

.form-control{

    width:100%;

    padding:12px 14px;

    border-radius:13px;

    outline:none;

    color:#fff;

    font-size:11px;

    background:
        rgba(255,255,255,.035);

    border:1px solid
        rgba(255,255,255,.08);

    transition:.3s;
}

.form-control:focus{

    border-color:
        rgba(180,124,255,.45);

    box-shadow:
        0 0 20px
        rgba(124,58,237,.08);

    background:
        rgba(255,255,255,.05);
}

textarea.form-control{
    min-height:100px;
    resize:vertical;
}

select.form-control{
    cursor:pointer;
}


/* =====================================================
   BUTTONS
===================================================== */

.btn{

    display:inline-flex;

    align-items:center;
    justify-content:center;

    gap:7px;

    padding:12px 18px;

    border-radius:13px;

    border:none;

    cursor:pointer;

    color:#fff;

    font-size:10px;
    font-weight:bold;

    transition:.3s;
}

.btn-primary{

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #2563eb,
            #0891b2
        );

    box-shadow:
        0 10px 30px
        rgba(124,58,237,.20);
}

.btn-primary:hover{

    transform:translateY(-3px);

    filter:brightness(1.12);

    box-shadow:
        0 15px 40px
        rgba(124,58,237,.32);
}

.btn-secondary{

    background:
        rgba(255,255,255,.045);

    border:1px solid
        rgba(255,255,255,.10);

    color:#ccc;
}

.btn-secondary:hover{

    color:#fff;

    transform:translateY(-3px);

    border-color:
        rgba(180,124,255,.40);
}

.btn-danger{

    background:
        rgba(220,38,38,.10);

    border:1px solid
        rgba(248,113,113,.20);

    color:#fca5a5;
}

.btn-danger:hover{

    background:
        rgba(220,38,38,.20);

    border-color:
        rgba(248,113,113,.40);
}


/* =====================================================
   TABLE
===================================================== */

.table-wrapper{

    width:100%;

    overflow-x:auto;
}

table{

    width:

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل مدیریت | Kian Music</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050509;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

/* =========================
   BACKGROUND GLOW
========================= */

body::before{
    content:"";
    position:fixed;
    width:420px;
    height:420px;
    background:#7c3aed;
    filter:blur(150px);
    opacity:.12;
    top:-180px;
    right:-120px;
    pointer-events:none;
    z-index:-1;
}

body::after{
    content:"";
    position:fixed;
    width:380px;
    height:380px;
    background:#00e5ff;
    filter:blur(160px);
    opacity:.07;
    bottom:-180px;
    left:-120px;
    pointer-events:none;
    z-index:-1;
}

/* =========================
   HEADER
========================= */

header{
    height:65px;
    position:sticky;
    top:0;
    z-index:100;

    padding:0 28px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:rgba(5,5,9,.78);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(255,255,255,.07);
}

.logo{
    font-size:15px;
    font-weight:900;
    letter-spacing:.2px;
}

.logo span{
    color:#8b5cf6;
}

.header-left{
    display:flex;
    align-items:center;
    gap:9px;
}

.header-btn{
    color:#aaa;
    text-decoration:none;

    padding:9px 13px;

    border-radius:9px;

    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.07);

    font-size:9px;

    cursor:pointer;
    transition:.2s;
}

.header-btn:hover{
    color:#fff;
    border-color:#7c3aed;
    background:rgba(124,58,237,.08);
}

/* =========================
   CONTAINER
========================= */

.container{
    width:min(1250px,94%);
    margin:28px auto 50px;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:18px;
}

.stat{
    padding:18px;

    border-radius:16px;

    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.07);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    transition:.25s;
}

.stat:hover{
    transform:translateY(-3px);
    border-color:rgba(124,58,237,.35);
    box-shadow:0 10px 35px rgba(124,58,237,.08);
}

.stat-icon{
    font-size:20px;
    margin-bottom:12px;
}

.stat-number{
    font-size:21px;
    font-weight:900;
}

.stat-title{
    margin-top:5px;
    color:#777;
    font-size:9px;
}

/* =========================
   DASHBOARD
========================= */

.dashboard-grid{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:15px;
}

.column{
    display:flex;
    flex-direction:column;
    gap:15px;
}

/* =========================
   CARD
========================= */

.card{
    padding:20px;

    border-radius:17px;

    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.07);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    box-shadow:0 15px 40px rgba(0,0,0,.12);
}

.card-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:17px;
}

.card-title h2{
    font-size:12px;
}

.card-title span{
    color:#666;
    font-size:9px;
}

/* =========================
   ACTIONS
========================= */

.actions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.action{
    display:flex;
    align-items:center;
    gap:11px;

    padding:13px;

    border-radius:12px;

    color:#fff;
    text-decoration:none;

    background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.06);

    transition:.2s;
}

.action:hover{
    background:rgba(124,58,237,.09);
    border-color:rgba(124,58,237,.35);
    transform:translateY(-2px);
}

.action-icon{
    width:36px;
    height:36px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:rgba(124,58,237,.1);

    font-size:17px;
}

.action strong{
    display:block;
    font-size:10px;
    margin-bottom:4px;
}

.action span{
    display:block;
    color:#666;
    font-size:8px;
}

/* =========================
   SECTION CONTROL
========================= */

.section-control{
    margin-top:17px;
    padding-top:17px;

    border-top:1px solid rgba(255,255,255,.06);
}

.section-control-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:12px;
}

.section-control-header strong{
    font-size:10px;
}

.section-control-header span{
    color:#666;
    font-size:8px;
}

.site-sections{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.site-section{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;

    padding:11px;

    border-radius:11px;

    background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.06);

    transition:.2s;
}

.site-section:hover{
    border-color:rgba(124,58,237,.22);
    background:rgba(124,58,237,.035);
}

.section-info{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.section-icon{
    width:36px;
    height:36px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:rgba(124,58,237,.09);

    font-size:16px;
}

.section-name{
    font-size:9px;
    font-weight:bold;
}

.section-description{
    color:#666;
    font-size:7px;
    margin-top:4px;
}

.section-status{
    margin-top:4px;
    font-size:7px;
}

.section-status.on{
    color:#5eead4;
}

.section-status.off{
    color:#ff7180;
}

/* =========================
   TOGGLE
========================= */

.section-toggle{
    position:relative;

    width:57px;
    height:29px;

    flex-shrink:0;

    border:0;
    border-radius:30px;

    background:#25232d;

    cursor:pointer;
    transition:.25s;
}

.section-toggle::after{
    content:"";

    position:absolute;

    width:21px;
    height:21px;

    top:4px;
    right:4px;

    border-radius:50%;

    background:#777;

    transition:.25s;
}

.section-toggle.active{
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    box-shadow:0 0 18px rgba(124,58,237,.2);
}

.section-toggle.active::after{
    right:32px;
    background:#fff;
}

/* =========================
   INFO
========================= */

.control-info{
    margin-top:11px;
    padding:10px 11px;

    border-radius:10px;

    background:rgba(0,229,255,.025);
    border:1px solid rgba(0,229,255,.06);

    color:#777;

    font-size:8px;
    line-height:1.9;
}

/* =========================
   VISITORS
========================= */

.visitor-top{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:15px;
}

.visitor-select{
    height:34px;

    padding:0 9px;

    border-radius:8px;

    background:#111018;
    color:#ddd;

    border:1px solid rgba(255,255,255,.08);

    font-size:9px;
    outline:none;

    cursor:pointer;
}

.visitor-select:focus{
    border-color:#7c3aed;
}

.visitor-number{
    font-size:25px;
    font-weight:900;
}

.visitor-label{
    color:#666;
    font-size:9px;
}

.visitor-bars{
    height:80px;

    display:flex;
    align-items:flex-end;

    gap:6px;
}

.bar{
    flex:1;

    border-radius:5px 5px 0 0;

    background:linear-gradient(
        180deg,
        #8b5cf6,
        #2563eb
    );

    opacity:.65;

    transition:.25s;
}

.bar:hover{
    opacity:1;
}

/* =========================
   ADMIN
========================= */

.admin-add{
    display:flex;
    gap:8px;
    margin-bottom:12px;
}

.admin-input{
    flex:1;

    height:40px;

    padding:0 11px;

    border-radius:9px;

    background:#111018;
    color:#fff;

    border:1px solid rgba(255,255,255,.08);

    outline:none;

    font-size:9px;
}

.admin-input::placeholder{
    color:#555;
}

.admin-input:focus{
    border-color:#7c3aed;
    box-shadow:0 0 15px rgba(124,58,237,.08);
}

.admin-add-btn{
    height:40px;

    padding:0 15px;

    border:0;
    border-radius:9px;

    background:linear-gradient(
        135deg,
        #7c3aed,
        #2563eb
    );

    color:#fff;

    font-size:9px;
    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.admin-add-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 8px 22px rgba(124,58,237,.2);
}

.admin-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.admin-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;

    padding:11px;

    border-radius:11px;

    background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.055);

    transition:.2s;
}

.admin-item:hover{
    border-color:rgba(124,58,237,.2);
}

.admin-name{
    font-size:9px;
    font-weight:bold;
}

.admin-role{
    color:#666;
    font-size:8px;
    margin-top:4px;
}

.admin-actions{
    display:flex;
    align-items:center;
    gap:6px;

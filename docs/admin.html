<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل مدیریت | Kian Music</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050509;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    width:420px;
    height:420px;
    background:#7c3aed;
    filter:blur(150px);
    opacity:.12;
    top:-180px;
    right:-120px;
    pointer-events:none;
    z-index:-1;
}

body::after{
    content:"";
    position:fixed;
    width:380px;
    height:380px;
    background:#00e5ff;
    filter:blur(160px);
    opacity:.07;
    bottom:-180px;
    left:-120px;
    pointer-events:none;
    z-index:-1;
}


/* =========================
   HEADER
========================= */

header{
    height:65px;
    position:sticky;
    top:0;
    z-index:100;

    padding:0 28px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:rgba(5,5,9,.78);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(255,255,255,.07);
}

.logo{
    font-size:15px;
    font-weight:900;
}

.logo span{
    color:#8b5cf6;
}

.header-left{
    display:flex;
    align-items:center;
    gap:9px;
}

.header-btn{
    color:#aaa;
    text-decoration:none;

    padding:9px 13px;

    border-radius:9px;

    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.07);

    font-size:9px;

    cursor:pointer;
    transition:.2s;
}

.header-btn:hover{
    color:#fff;
    border-color:#7c3aed;
    background:rgba(124,58,237,.08);
}


/* =========================
   CONTAINER
========================= */

.container{
    width:min(1250px,94%);
    margin:28px auto 50px;
}


/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:18px;
}

.stat{
    padding:18px;

    border-radius:16px;

    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.07);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    transition:.25s;
}

.stat:hover{
    transform:translateY(-3px);
    border-color:rgba(124,58,237,.35);
}

.stat-icon{
    font-size:20px;
    margin-bottom:12px;
}

.stat-number{
    font-size:21px;
    font-weight:900;
}

.stat-title{
    margin-top:5px;
    color:#777;
    font-size:9px;
}


/* =========================
   DASHBOARD
========================= */

.dashboard-grid{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:15px;
}

.column{
    display:flex;
    flex-direction:column;
    gap:15px;
}


/* =========================
   CARD
========================= */

.card{
    padding:20px;

    border-radius:17px;

    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.07);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
}

.card-title{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:17px;
}

.card-title h2{
    font-size:12px;
}

.card-title span{
    color:#666;
    font-size:9px;
}


/* =========================
   ACTIONS
========================= */

.actions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.action{
    display:flex;
    align-items:center;
    gap:11px;

    padding:13px;

    border-radius:12px;

    color:#fff;
    text-decoration:none;

    background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.06);

    transition:.2s;
}

.action:hover{
    background:rgba(124,58,237,.09);
    border-color:rgba(124,58,237,.35);
    transform:translateY(-2px);
}

.action-icon{
    width:36px;
    height:36px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:rgba(124,58,237,.1);

    font-size:17px;
}

.action strong{
    display:block;
    font-size:10px;
    margin-bottom:4px;
}

.action span{
    display:block;
    color:#666;
    font-size:8px;
}


/* =========================
   SECTION CONTROL
========================= */

.section-control{
    margin-top:17px;
    padding-top:17px;

    border-top:1px solid rgba(255,255,255,.06);
}

.section-control-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:12px;
}

.section-control-header strong{
    font-size:10px;
}

.section-control-header span{
    color:#666;
    font-size:8px;
}

.site-sections{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.site-section{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;

    padding:11px;

    border-radius:11px;

    background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.06);
}

.section-info{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.section-icon{
    width:36px;
    height:36px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:rgba(124,58,237,.09);

    font-size:16px;
}

.section-name{
    font-size:9px;
    font-weight:bold;
}

.section-description{
    color:#666;
    font-size:7px;
    margin-top:4px;
}

.section-status{
    margin-top:4px;
    font-size:7px;
}

.section-status.on{
    color:#5eead4;
}

.section-status.off{
    color:#ff7180;
}


/* =========================
   TOGGLE
========================= */

.section-toggle{
    position:relative;

    width:57px;
    height:29px;

    flex-shrink:0;

    border:0;
    border-radius:30px;

    background:#25232d;

    cursor:pointer;
    transition:.25s;
}

.section-toggle::after{
    content:"";

    position:absolute;

    width:21px;
    height:21px;

    top:4px;
    right:4px;

    border-radius:50%;

    background:#777;

    transition:.25s;
}

.section-toggle.active{
    background:linear-gradient(
        135deg,
        #7c3aed,
        #2563eb
    );
}

.section-toggle.active::after{
    right:32px;
    background:#fff;
}


/* =========================
   INFO
========================= */

.control-info{
    margin-top:11px;

    padding:10px 11px;

    border-radius:10px;

    background:rgba(0,229,255,.025);

    border:1px solid rgba(0,229,255,.06);

    color:#777;

    font-size:8px;

    line-height:1.9;
}


/* =========================
   VISITOR
========================= */

.visitor-top{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:15px;
}

.visitor-select{
    height:34px;

    padding:0 9px;

    border-radius:8px;

    background:#111018;

    color:#ddd;

    border:1px solid rgba(255,255,255,.08);

    font-size:9px;

    outline:none;
}

.visitor-number{
    font-size:25px;
    font-weight:900;
}

.visitor-label{
    color:#666;
    font-size:9px;
}

.visitor-bars{
    height:80px;

    display:flex;
    align-items:flex-end;

    gap:6px;
}

.bar{
    flex:1;

    border-radius:5px 5px 0 0;

    background:linear-gradient(
        180deg,
        #8b5cf6,
        #2563eb
    );

    opacity:.65;
}


/* =========================
   ADMIN
========================= */

.admin-add{
    display:flex;
    gap:8px;
    margin-bottom:12px;
}

.admin-input{
    flex:1;

    height:40px;

    padding:0 11px;

    border-radius:9px;

    background:#111018;

    color:#fff;

    border:1px solid rgba(255,255,255,.08);

    outline:none;

    font-size:9px;
}

.admin-input:focus{
    border-color:#7c3aed;
}

.admin-add-btn{
    height:40px;

    padding:0 15px;

    border:0;
    border-radius:9px;

    background:linear-gradient(
        135deg,
        #7c3aed,
        #2563eb
    );

    color:#fff;

    font-size:9px;
    font-weight:bold;

    cursor:pointer;
}

.admin-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.admin-item{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    padding:11px;

    border-radius:11px;

    background:rgba(255,255,255,.025);

    border:1px solid rgba(255,255,255,.055);
}

.admin-name{
    font-size:9px;
    font-weight:bold;
}

.admin-role{
    color:#666;
    font-size:8px;
    margin-top:4px;
}

.admin-actions{
    display:flex;
    align-items:center;
    gap:6px;
}

.access-select{
    height:32px;

    padding:0 7px;

    border-radius:7px;

    background:#111018;

    color:#ddd;

    border:1px solid rgba(255,255,255,.08);

    font-size:8px;

    outline:none;
}

.remove-admin{
    height:32px;

    padding:0 9px;

    border-radius:7px;

    border:1px solid rgba(255,60,80,.15);

    background:rgba(255,60,80,.05);

    color:#ff7180;

    font-size:8px;

    cursor:pointer;
}

.access-info{
    margin-top:12px;

    padding:10px;

    border-radius:9px;

    color:#777;

    background:rgba(0,229,255,.025);

    border:1px solid rgba(0,229,255,.06);

    font-size:8px;

    line-height:1.9;
}


/* =========================
   EMPTY
========================= */

.empty{
    padding:35px 10px;

    text-align:center;

    color:#555;

    font-size:9px;
}


/* =========================
   STATUS
========================= */

.status{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:12px;

    border-radius:11px;

    background:rgba(0,255,170,.025);

    border:1px solid rgba(0,255,170,.08);
}

.status-left{
    display:flex;
    align-items:center;
    gap:9px;
}

.status-dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:#22c55e;

    box-shadow:0 0 10px #22c55e;
}

.status-text strong{
    display:block;
    font-size:9px;
}

.status-text span{
    display:block;

    margin-top:4px;

    color:#666;

    font-size:7px;
}


/* =========================
   QUICK
========================= */

.quick{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.quick a{
    padding:11px;

    text-align:center;

    color:#aaa;

    text-decoration:none;

    border-radius:9px;

    background:rgba(255,255,255,.025);

    border:1px solid rgba(255,255,255,.06);

    font-size:8px;

    transition:.2s;
}

.quick a:hover{
    color:#fff;
    border-color:#7c3aed;
}


/* ==================================================
   ADS
================================================== */

.ads-add{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:9px;

    margin-bottom:15px;
}

.ads-field{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.ads-field.full{
    grid-column:1 / -1;
}

.ads-field label{
    color:#777;
    font-size:8px;
}

.ads-input,
.ads-select,
.ads-textarea{
    width:100%;

    border-radius:9px;

    background:#111018;

    color:#fff;

    border:1px solid rgba(255,255,255,.08);

    outline:none;

    font-size:9px;
}

.ads-input,
.ads-select{
    height:40px;

    padding:0 11px;
}

.ads-textarea{
    min-height:75px;

    padding:11px;

    resize:vertical;
}

.ads-input:focus,
.ads-select:focus,
.ads-textarea:focus{
    border-color:#7c3aed;
}

.ads-select{
    cursor:pointer;
}

.ads-button-row{
    display:flex;

    gap:8px;

    grid-column:1 / -1;
}

.ads-save{
    height:40px;

    flex:1;

    border:0;

    border-radius:9px;

    background:linear-gradient(
        135deg,
        #7c3aed,
        #2563eb
    );

    color:#fff;

    font-size:9px;

    font-weight:bold;

    cursor:pointer;
}

.ads-cancel{
    height:40px;

    padding:0 18px;

    border-radius:9px;

    border:1px solid rgba(255,255,255,.08);

    background:rgba(255,255,255,.035);

    color:#aaa;

    font-size:9px;

    cursor:pointer;

    display:none;
}


/* =========================
   ADS TYPES
========================= */

.ad-types{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:8px;

    margin-bottom:15px;
}

.ad-type{
    padding:12px;

    border-radius:11px;

    background:rgba(255,255,255,.025);

    border:1px solid rgba(255,255,255,.06);

    text-align:center;

    cursor:pointer;

    transition:.2s;
}

.ad-type:hover{
    border-color:rgba(124,58,237,.35);
}

.ad-type-icon{
    font-size:19px;

    margin-bottom:7px;
}

.ad-type strong{
    display:block;

    font-size:8px;

    margin-bottom:4px;
}

.ad-type span{
    color:#666;

    font-size:7px;
}


/* =========================
   ADS LIST
========================= */

.ads-list{
    display:flex;

    flex-direction:column;

    gap:9px;
}

.ad-item{
    padding:13px;

    border-radius:12px;

    background:rgba(255,255,255,.025);

    border:1px solid rgba(255,255,255,.06);

    transition:.2s;
}

.ad-item:hover{
    border-color:rgba(124,58,237,.25);
}

.ad-item-top{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-bottom:9px;
}

.ad-item-title{
    font-size:10px;

    font-weight:bold;
}

.ad-item-type{
    display:inline-block;

    margin-top:4px;

    color:#8b5cf6;

    font-size:7px;
}

.ad-item-details{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:7px;

    margin-top:9px;
}

.ad-detail{
    padding:8px;

    border-radius:8px;

    background:rgba(255,255,255,.025);
}

.ad-detail span{
    display:block;

    color:#555;

    font-size:7px;

    margin-bottom:4px;
}

.ad-detail strong{
    font-size:8px;
}

.ad-item-actions{
    display:flex;

    gap:7px;

    margin-top:10px;
}

.ad-edit,
.ad-delete,
.ad-status{
    height:32px;

    padding:0 11px;

    border-radius:7px;

    font-size:8px;

    cursor:pointer;
}

.ad-edit{
    color:#aaa;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.08);
}

.ad-delete{
    color:#ff7180;

    background:rgba(255,60,80,.04);

    border:1px solid rgba(255,60,80,.13);
}

.ad-status{
    color:#5eead4;

    background:rgba(0,255,170,.035);

    border:1px solid rgba(0,255,170,.1);
}

.ad-status.off{
    color:#ff7180;

    background:rgba(255,60,80,.04);

    border-color:rgba(255,60,80,.12);
}


/* =========================
   ADS PRICE
========================= */

.price-info{
    margin-top:12px;

    padding:11px;

    border-radius:10px;

    background:rgba(124,58,237,.035);

    border:1px solid rgba(124,58,237,.09);

    color:#777;

    font-size:8px;

    line-height:2;
}


/* =========================
   LOGOUT
========================= */

.logout{
    width:100%;

    height:42px;

    border:1px solid rgba(

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kian Music</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#080808;
color:#fff;
}

header{
background:#101010;
border-bottom:1px solid #222;
padding:20px;
position:sticky;
top:0;
z-index:10;
}

.header{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:24px;
font-weight:bold;
}

.logo span{
color:#777;
}

nav{
display:flex;
gap:20px;
}

nav a{
color:#aaa;
text-decoration:none;
font-size:14px;
}

nav a:hover{
color:white;
}

.hero{
max-width:1100px;
margin:auto;
padding:60px 20px 35px;
}

.hero h1{
font-size:40px;
margin-bottom:15px;
}

.hero p{
color:#888;
line-height:2;
}

.search-box{
max-width:1100px;
margin:auto;
padding:0 20px 30px;
}

.search{
width:100%;
padding:16px 18px;
background:#151515;
border:1px solid #292929;
border-radius:12px;
outline:none;
color:white;
font-size:15px;
}

.container{
max-width:1100px;
margin:auto;
padding:0 20px;
}

.section-title{
font-size:22px;
margin-bottom:20px;
}

.music{
background:#121212;
border:1px solid #222;
border-radius:16px;
padding:18px;
margin-bottom:15px;
}

.song{
display:flex;
align-items:center;
gap:15px;
}

.cover{
width:75px;
height:75px;
border-radius:12px;
object-fit:cover;
background:#222;
}

.song-info h2{
font-size:17px;
margin-bottom:8px;
}

.song-info p{
color:#888;
font-size:13px;
}

audio{
width:100%;
margin-top:18px;
}

.download{
display:inline-block;
margin-top:15px;
padding:11px 18px;
background:white;
color:black;
text-decoration:none;
border-radius:9px;
font-size:13px;
font-weight:bold;
}

footer{
margin-top:70px;
padding:35px 20px;
text-align:center;
border-top:1px solid #222;
color:#666;
font-size:13px;
}

@media(max-width:600px){

.hero h1{
font-size:30px;
}

nav{
gap:10px;
}

nav a{
font-size:12px;
}

}

</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
Kian <span>Music</span>
</div>

<nav>

<a href="index.html">خانه</a>

<a href="#musicList">آهنگ‌ها</a>

<a href="send.html">📤 ارسال آهنگ</a>

</nav>

</div>

</header>


<section class="hero">

<h1>
Kian Music 🎵
</h1>

<p>
جدیدترین آهنگ‌ها را آنلاین گوش کنید و با کیفیت بالا دانلود کنید.
</p>

</section>


<div class="search-box">

<input
class="search"
id="search"
type="text"
placeholder="🔎 جستجوی آهنگ یا خواننده..."
onkeyup="searchMusic()">

</div>


<main class="container">

<h2 class="section-title">
آخرین آهنگ‌ها
</h2>


<div id="musicList">


<!-- آهنگ شماره ۱ -->

<div class="music">

<div class="song">

<img
class="cover"
src="https://placehold.co/300x300"
alt="کاور آهنگ">

<div class="song-info">

<h2>
آهنگ من
</h2>

<p>
خواننده: Kian
</p>

</div>

</div>


<audio controls preload="metadata">

<source
src="../song1.mp3"
type="audio/mpeg">

مرورگر شما از پخش صوت پشتیبانی نمی‌کند.

</audio>


<a
class="download"
href="../song1.mp3"
download>

⬇ دانلود آهنگ

</a>

</div>


<!-- آهنگ شماره ۲ -->

<div class="music">

<div class="song">

<img
class="cover"
src="https://placehold.co/300x300"
alt="کاور آهنگ">

<div class="song-info">

<h2>
آهنگ نمونه ۲
</h2>

<p>
خواننده: Kian
</p>

</div>

</div>


<audio controls preload="metadata">

<source
src="../song1.mp3"
type="audio/mpeg">

</audio>


<a
class="download"
href="../song1.mp3"
download>

⬇ دانلود آهنگ

</a>

</div>


</div>

</main>


<footer>

© 2026 Kian Music

<br><br>

تمامی حقوق محفوظ است.

</footer>


<script>

function searchMusic(){

let input =
document.getElementById("search")
.value
.toLowerCase();

let songs =
document.querySelectorAll(".music");

songs.forEach(function(song){

let text =
song.innerText.toLowerCase();

if(text.includes(input)){

song.style.display="block";

}else{

song.style.display="none";

}

});

}

</script>

</body>
</html>

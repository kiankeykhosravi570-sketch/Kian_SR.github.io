<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<title>Kian Music | موسیقی</title>

<style>

/* =========================
   RESET
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:#050509;
color:#fff;
min-height:100vh;
overflow-x:hidden;
}


/* =========================
   NEON BACKGROUND
========================= */

body::before{
content:"";

position:fixed;

width:650px;
height:650px;

background:#7c3aed;

filter:blur(210px);

opacity:.16;

top:-280px;
right:-200px;

z-index:-2;

pointer-events:none;
}

body::after{
content:"";

position:fixed;

width:600px;
height:600px;

background:#00e5ff;

filter:blur(220px);

opacity:.09;

bottom:-300px;
left:-200px;

z-index:-2;

pointer-events:none;
}


/* =========================
   HEADER
========================= */

header{
position:relative;
z-index:1000;
background:transparent;
}


/* =========================
   HEADER / LOGO
========================= */

.header{

max-width:1200px;

margin:auto;

display:flex;

align-items:center;

justify-content:space-between;

gap:20px;

padding:15px 20px;

}


/* LOGO */

.logo{

font-size:25px;

font-weight:900;

white-space:nowrap;

background:
linear-gradient(
90deg,
#ffffff,
#b47cff,
#00e5ff
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

text-shadow:
0 0 25px rgba(124,58,237,.12);

}


/* =========================
   STICKY NAV WRAPPER
========================= */

.nav-wrapper{

position:sticky;

top:0;

z-index:99999;

width:100%;

background:rgba(5,5,9,.88);

backdrop-filter:blur(22px);

-webkit-backdrop-filter:blur(22px);

border-top:1px solid rgba(255,255,255,.05);

border-bottom:1px solid rgba(255,255,255,.08);

box-shadow:
0 8px 30px rgba(0,0,0,.30);

padding:10px 20px;

}


/* =========================
   NAV
========================= */

nav{

max-width:1200px;

margin:auto;

display:flex;

align-items:center;

justify-content:center;

gap:9px;

flex-wrap:wrap;

}

nav a{

display:inline-flex;

align-items:center;

justify-content:center;

padding:10px 13px;

border-radius:12px;

text-decoration:none;

color:#cfcfe0;

font-size:11px;

border:1px solid rgba(255,255,255,.12);

background:
linear-gradient(
135deg,
rgba(255,255,255,.07),
rgba(255,255,255,.025)
);

box-shadow:
inset 0 1px 0 rgba(255,255,255,.05),
0 5px 18px rgba(0,0,0,.22);

backdrop-filter:blur(12px);

transition:.25s;

white-space:nowrap;

}

nav a:hover{

color:#fff;

transform:translateY(-2px);

background:
linear-gradient(
135deg,
rgba(124,58,237,.35),
rgba(0,229,255,.08)
);

border-color:
rgba(180,124,255,.55);

box-shadow:
0 0 25px rgba(124,58,237,.20);

}

nav a.admin{

border-color:
rgba(0,229,255,.20);

}


/* =========================
   BACK TO TOP
========================= */

.back-to-top{

position:fixed;

right:25px;

bottom:25px;

width:48px;

height:48px;

display:flex;

align-items:center;

justify-content:center;

border-radius:15px;

text-decoration:none;

font-size:21px;

font-weight:bold;

color:rgba(255,255,255,.75);

background:
linear-gradient(
135deg,
rgba(124,58,237,.20),
rgba(0,229,255,.08)
);

border:1px solid rgba(180,124,255,.25);

box-shadow:
0 0 25px rgba(124,58,237,.15),
inset 0 0 15px rgba(255,255,255,.03);

backdrop-filter:blur(12px);

-webkit-backdrop-filter:blur(12px);

opacity:0;

visibility:hidden;

transform:translateY(15px);

transition:.35s;

z-index:999999;

cursor:pointer;

}

.back-to-top.show{

opacity:.75;

visibility:visible;

transform:translateY(0);

}

.back-to-top:hover{

opacity:1;

transform:translateY(-4px);

color:#fff;

border-color:rgba(180,124,255,.55);

box-shadow:
0 0 30px rgba(124,58,237,.30),
0 0 50px rgba(0,229,255,.08);

}

rgba(180,124,255,.40);

0 0 25px rgba(124,58,237,.10);

}


/* =========================
   SECTION
========================= */

.section{

max-width:1100px;

margin:0 auto 70px;

}

.section-title{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:20px;

}

.section-title h2{

font-size:20px;

font-weight:900;

}

.section-title span{

font-size:10px;

color:#666;

}
